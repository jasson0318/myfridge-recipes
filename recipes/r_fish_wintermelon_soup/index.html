<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>冬瓜魚片湯 — MyFridge 食譜</title>
  <link rel="stylesheet" href="../../assets/site.css" />
</head>
<body>
  <div class="wrap">
    <nav class="top-nav">
      <a href="../../" class="back-link">← 返回食譜列表</a>
    </nav>

    <article class="recipe-article">
      <div class="recipe-hero-wrap">
        <img
          src="hero.png"
          alt="冬瓜魚片湯"
          class="hero-img zoomable-img"
          data-zoom-src="hero.png"
          data-zoom-title="冬瓜魚片湯"
          loading="lazy"
        />
      </div>

      <header class="recipe-header">
        <h1 class="recipe-title">冬瓜魚片湯</h1>
        <div class="meta-row">
          <span class="meta-badge badge-cat">湯品</span>
      <span class="meta-badge badge-time">⏱️ 25 分鐘</span>
      <span class="meta-badge badge-diff">🍳 簡單</span>
      <span class="meta-badge badge-servings">👥 2 人份</span>
      <span class="meta-badge badge-free">FREE</span>
        </div>
      </header>

      <div class="desc-card">
    <p class="desc-text">清甜冬瓜搭配魚片，家常湯品。完整食譜圖為網站主內容。</p>
  </div>

      <div class="content-grid">
        <div class="main-col">
          <section class="card guide-card">
            <div class="card-head">
              <span class="head-icon">📖</span>
              <h2>食譜指南</h2>
              <span class="head-tip">點擊可放大檢視 🔍</span>
            </div>
            <div class="sheet-wrap">
              <img
                src="recipe.png"
                alt="冬瓜魚片湯 食譜指南"
                class="sheet-img zoomable-img"
                data-zoom-src="recipe.png"
                data-zoom-title="冬瓜魚片湯 食譜指南"
                loading="lazy"
              />
            </div>
          </section>




        </div>

        <aside class="side-col">
          <section class="card ing-card">
            <div class="card-head">
              <span class="head-icon">🥗</span>
              <h2>食材清單</h2>
              <span class="head-sub">2 人份</span>
            </div>
            <ul class="ing-list">
          <li class="ing-item">
            <div class="ing-name-wrap">
              <span class="ing-name">魚片</span>
              
            </div>
            <span class="ing-qty">250 g</span>
          </li>
          <li class="ing-item">
            <div class="ing-name-wrap">
              <span class="ing-name">冬瓜</span>
              
            </div>
            <span class="ing-qty">400 g</span>
          </li>
          <li class="ing-item">
            <div class="ing-name-wrap">
              <span class="ing-name">薑絲</span>
              
            </div>
            <span class="ing-qty">10 g</span>
          </li>
            </ul>
          </section>




        </aside>
      </div>
    </article>
  </div>

  <dialog id="zoomDialog" class="zoom-dialog">
    <div class="zoom-header">
      <span id="zoomTitle">圖片放大檢視</span>
      <div class="zoom-actions">
        <a id="zoomNewTab" class="btn-sm" href="#" target="_blank" rel="noopener">新分頁開啟 ↗</a>
        <button type="button" class="btn-sm" id="zoomClose">✕ 關閉</button>
      </div>
    </div>
    <div class="zoom-body">
      <img id="zoomImg" src="" alt="放大預覽" />
    </div>
  </dialog>

  <script>
    (function() {
      const dialog = document.getElementById('zoomDialog');
      const img = document.getElementById('zoomImg');
      const title = document.getElementById('zoomTitle');
      const newTab = document.getElementById('zoomNewTab');
      const closeBtn = document.getElementById('zoomClose');
      if (dialog && img) {
        document.querySelectorAll('.zoomable-img').forEach(el => {
          el.addEventListener('click', () => {
            const src = el.getAttribute('data-zoom-src') || el.src;
            const heading = el.getAttribute('data-zoom-title') || el.alt || '圖片放大檢視';
            img.src = src;
            if (title) title.textContent = heading;
            if (newTab) newTab.href = src;
            if (typeof dialog.showModal === 'function') dialog.showModal();
          });
        });
        if (closeBtn) closeBtn.addEventListener('click', () => dialog.close());
        dialog.addEventListener('click', (e) => {
          const rect = dialog.getBoundingClientRect();
          if (e.clientY < rect.top || e.clientY > rect.bottom || e.clientX < rect.left || e.clientX > rect.right) {
            dialog.close();
          }
        });
      }
    })();
  </script>
</body>
</html>
