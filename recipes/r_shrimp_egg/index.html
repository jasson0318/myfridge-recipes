<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <title>蝦仁滑蛋 — MyFridge</title>

<body>

    <p class="muted"><a href="../../">← 返回列表</a></p>
    <header>
      <h1>蝦仁滑蛋</h1>
      <div class="meta">
        <span class="badge">r_shrimp_egg</span>

    <section class="panel">
